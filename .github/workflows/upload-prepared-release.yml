name: Upload prepared release
on:
  workflow_dispatch:
  push:
    branches: ['release-upload-*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Reconstruct and verify the already built APK
        run: |
          cat apk.part-* > FermataX-yeni-arayuz-debug.apk
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          metadata=json.loads(Path('update-auto-debug.json').read_text())
          apk=Path('FermataX-yeni-arayuz-debug.apk')
          with apk.open('rb') as stream:
              actual=hashlib.file_digest(stream,'sha256').hexdigest()
          assert actual == metadata['sha256']
          assert apk.stat().st_size == metadata['size']
          assert metadata['packageId'] == 'me.app.fermataX.auto.debug'
          assert metadata['versionCode'] == 309
          with zipfile.ZipFile('FermataX-yeni-arayuz-kaynak.zip') as source:
              assert source.testzip() is None
          PY
      - name: Upload assets and publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v2.0.2 FermataX-yeni-arayuz-debug.apk update-auto-debug.json FermataX-yeni-arayuz-kaynak.zip yeni-ana-ekran.png tum-menuler-onizleme.png DOGRULAMA_TR.txt --clobber
          gh release edit v2.0.2 --draft=false --latest
