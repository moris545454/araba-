name: Build test APK

# Builds the universal Dem TV APK on GitHub's runners (which can reach the Android SDK)
# and publishes it as a prerelease. A prerelease is never offered by the in-app updater.
# Without the stable keystore secret the APK is signed with a fresh debug key, so it can
# only be installed on phones that do not already have Dem TV installed.

on:
  push:
    branches: [feature/tv-user-playlists]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NO_GS: true
      ANDROID_USER_HOME: ${{ github.workspace }}/.android
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;29.0.14206865
      - uses: gradle/actions/setup-gradle@v6

      - name: Use the stable signing key when it is configured
        env:
          DEBUG_KEYSTORE: ${{ secrets.FERMATAX_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$ANDROID_USER_HOME"
          if [ -n "$DEBUG_KEYSTORE" ]; then
            printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > "$ANDROID_USER_HOME/debug.keystore"
            chmod 600 "$ANDROID_USER_HOME/debug.keystore"
            echo "Stable signing key restored."
          else
            echo "::warning::No signing secret; the APK uses a new debug key."
          fi

      - name: Build universal APK
        run: bash gradlew verifyWebOnlyProductionGraph :fermata:packageAutoDebugUniversalApk --console=plain

      - name: Verify APK contents
        id: apk
        run: |
          mkdir -p out
          cp fermata/build/outputs/apk_from_bundle/autoDebug/*-universal.apk out/FermataX-yeni-arayuz-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs out/FermataX-yeni-arayuz-debug.apk | tee out/signature.txt
          python3 scripts/verify_security_apk.py out/FermataX-yeni-arayuz-debug.apk --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" --output out/security-apk-check.json
          sha256sum out/FermataX-yeni-arayuz-debug.apk | tee out/sha256.txt
          version=$(grep -oP '^appVersionName = "\K[^"]+' gradle/libs.versions.toml)
          echo "tag=v$version-test" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DemTV-test-apk-${{ github.sha }}
          path: out/

      - name: Unit tests
        run: bash gradlew :tv:testMobileDebugUnitTest :web:testMobileDebugUnitTest :fermata:testMobileDebugUnitTest :fermata:testAutoDebugUnitTest --console=plain

      - name: Lint
        run: bash gradlew :fermata:lintMobileDebug :fermata:lintAutoDebug --console=plain

      - name: Publish test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.apk.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/FermataX-yeni-arayuz-debug.apk out/sha256.txt out/security-apk-check.json --clobber
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "Dem TV $TAG" \
              --notes-file UPDATE_RELEASE_NOTES_TR.md \
              out/FermataX-yeni-arayuz-debug.apk out/sha256.txt out/security-apk-check.json
          fi
